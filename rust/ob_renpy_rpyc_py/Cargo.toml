[package]
name = "ob_renpy_rpyc_py"
version = "0.1.0"
edition = "2021"
description = "PyO3-обёртка распаковки .rpyc Ren'Py (extract_rpyc поверх ob_renpy_rpyc)"
license = "GPL-3.0-or-later"

[dependencies]
ob_renpy_rpyc = { path = "../ob_renpy_rpyc" }
pyo3 = { version = "0.26", features = ["extension-module"] }

[lib]
name = "_ob_renpy_rpyc_py"
crate-type = ["cdylib"]
